schema_version: 1

context:
  version: "2.7.1"
  mpl_min: "3.9"
  mpl_max: "3.12"

package:
  name: ultraplot
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/u/ultraplot/ultraplot-${{ version }}.tar.gz
  sha256: 71c7a5917b562def85cbcb87c1217c3182464867b4c76a0dd6eb982e9df86c73

build:
  number: 0
  noarch: python
  script:
    content: pip install . -vv
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
  python:
    entry_points:
      - ultraplot-mcp = ultraplot.mcp:main
  files:
    exclude:
      - var/cache/fontconfig/*
      - "**/site-packages/ultraplot/tests/**"
      - "**/site-packages/tools/**"

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools-scm
    - numpy >=1.26.0
    - matplotlib-base >=${{ mpl_min }},<${{ mpl_max }}
  run:
    - python >=${{ python_min }}
    - numpy >=1.26.0
    - matplotlib-base >=${{ mpl_min }},<${{ mpl_max }}
    - typing-extensions

tests:
  - python:
      imports:
        - ultraplot
      python_version:
        - ${{ python_min }}.*
        - "*"

  - script:
      interpreter: python
      content: |
        import ultraplot as uplt

        assert uplt.__version__ == '${{ version }}'

        fig, ax = uplt.subplots()
        ax.plot([0, 1], [0, 1])

  - script:
      content:
        - ultraplot-mcp --help
    requirements:
      run:
        - python ${{ python_min }}.*
        - matplotlib-base ${{ mpl_min }}.*
        - mcp >=2.1,<3

about:
  homepage: https://ultraplot.readthedocs.io/
  license: MIT
  license_file: LICENSE.txt
  summary: Elegant and flexible high-level plotting with matplotlib
  description: |
    Ultraplot is a Python library that provides a high-level interface for creating
    publication-quality plots using matplotlib. It focuses on making common plotting
    tasks simple while maintaining full flexibility for customization.
  repository: https://github.com/ultraplot/ultraplot
  documentation: https://ultraplot.readthedocs.io/

extra:
  recipe-maintainers:
    - cvanelteren
    - beckermr
    - munechika-koyo
